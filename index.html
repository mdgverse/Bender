<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bender Studio</title>
  <script>
    // GitHub Pages publishes the self-contained build in the repository root.
    // Keep the Vite entry point for local development and use the static build on Pages.
    if (location.hostname.toLowerCase() === 'mdgverse.github.io' && /^\/Bender\/(?:index\.html)?$/i.test(location.pathname)) {
      location.replace('./bender-studio.html' + location.search + location.hash);
    }
  </script>
</head>
<body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
